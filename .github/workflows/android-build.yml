
name: ChatNova Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "android/**"

permissions:
  contents: write

jobs:
  build-android:
    name: Build ChatNova APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Build web application
        run: npm run build

      - name: Generate Android project if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Save Android project to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android
          if ! git diff --cached --quiet; then
            git commit -m "Generate ChatNova Android project"
            git push
          fi

      - name: Build Debug APK
             - run: |
          cd android
          echo "===== ANDROID MANIFEST CONTENT ====="
          nl -ba app/src/main/AndroidManifest.xml
          echo "===== XML DECLARATION LOCATIONS ====="
          grep -n '<?xml' app/src/main/AndroidManifest.xml || true
          echo "===== BUILD START ====="
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatNova-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
